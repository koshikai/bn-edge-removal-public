- canonical_slug: boolean-network-hamming-distance-limitations
  title_ja: ブーリアンネットワークにおけるハミング距離の限界と動的距離の設計意義
  title_en: Hamming Distance Limitations in Boolean Network Control
  entry_type: implementation_note
  domain_area: edge_removal_control
  scope: global
  canonical_statement: Hamming distance between binary states does not correlate with dynamic
    reachability in Boolean networks. The Q-value function V(s) = max_a Q(s,a) serves as the
    true dynamic control distance.
  formal_expression: d_Hamming(x,y) uncorrelated with min-step distance; V(s) = max_a Q(s,a)
    ≈ dynamic control distance
  plain_explanation: ハミング距離が小さくても目標到達しやすいとは限らない(カスケード効果・アトラクタ流域のセパラトリックス)。報酬設計で「ハミング距離に比例したステップ報酬」を使うとローカルミニマムにトラップされる。推奨設計は目標到達の二値フラグ報酬
    + 終端報酬の組み合わせ。
  applicability: Applies to reward function design and result visualization in all BN control
    experiments.
  exception_note: Hamming distance is still useful as a visual aid in convergence trajectory
    plots, but must not be interpreted as a control proximity metric.
  status: reviewed
  confidence: 0.95
  aliases:
  - hamming distance limitation
  - dynamic control distance
  tags:
  - reward_shaping
  - control_distance
  - hamming
