- canonical_slug: reward-goal-onset-cost
  title_ja: 目標集合内の新規介入コスト
  title_en: 'Reward: Goal Onset Cost'
  entry_type: metric
  domain_area: reward_design
  scope: project_specific
  canonical_statement: 'The goal-onset-cost term penalizes each intervention onset made
    while the pre-transition state is in the goal set.'
  formal_expression: r_goal_onset = -goal_onset_cost · 1[x_t ∈ X_goal] · Σ_i 1[h_i=0 ∧ u_i=1]
  plain_explanation: goal_onset_cost は、目標集合に入ってから新しく除去したエッジにだけ追加コストを与える。除去済みエッジを u=1 で保持するだけのステップには課金されないため、単調性制約で制御が崩れない。
  applicability: Applies to reward shaping when unnecessary interventions at the target
    should be priced more heavily than interventions elsewhere.
  exception_note: Under recovery, h_i=0 means 'not cooling down', so every admissible
    re-intervention is an onset and the term reduces to a goal-conditional edge cost.
  status: canonical
  confidence: 0.95
  aliases:
  - goal_onset_cost
  tags:
