- canonical_slug: reward-new-edge-cost
  title_ja: 新規介入エッジコスト
  title_en: 'Reward: New Edge Cost'
  entry_type: metric
  domain_area: reward_design
  scope: project_specific
  canonical_statement: 'The new-edge-cost term penalizes each intervention onset: an edge
    with h_i=0 that is intervened at the current step.'
  formal_expression: r_new_edge = -new_edge_cost · Σ_i 1[h_i=0 ∧ u_i=1]
  plain_explanation: new_edge_cost は、h_i=0 のエッジに介入したステップ、すなわち介入の開始時にだけ追加コストを与える。monotone では
    h_i=0 は「未除去」を意味するので各エッジの初回除去のみ、recovery では h_i=0 は「休薬中でない」を意味するので休薬明けの再介入のたびに課される。
  applicability: Applies to reward shaping in monotone and recovery settings.
  exception_note: In recovery mode h_i=0 means 'not cooling down', so the cost re-applies
    at every non-violating intervention, not only at the first removal.
  status: canonical
  confidence: 0.98
  aliases:
  - new_edge_cost
  tags:
  - reward
  - intervention_history
  source_keys:
  - code:env_py
  - test:env_reward
  network_keys: []
  constraint_keys:
  - monotone
  - recovery
