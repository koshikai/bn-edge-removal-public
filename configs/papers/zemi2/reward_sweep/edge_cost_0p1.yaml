# 準拠: 削除したハード制約版原稿の介入コスト（c_edge=0.1）。不要な介入で目標集合を出る軌道が残る
#
# ゼミ資料 2（tex/zemi2/）の報酬設計の掃引。Wnt5a のみ，全 128 状態を学習・評価する。
seeds:
- 11
- 12
- 13
- 14
- 15
output_dir: outputs/papers/zemi2_reward_sweep
learning:
  alpha: 0.5
  gamma: 0.99
  epsilon:
    start: 1.0
    end: 0.01
reward:
  step: 2.0
  terminal: 80.0
  edge_cost: 0.1
  violation_penalty: 0.0
horizon:
  max_steps: 10
models:
  wnt5a:
    episodes: 24000
    reach_horizon: 7
    constraint_type: recovery
    recovery_tau: 2
    initial_states: all
