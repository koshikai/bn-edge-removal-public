# ゼミ資料 2（tex/zemi2/）: 成功判定（goal_spec）の主比較。c_edge=1.0，n-step n=10。
#
# 現行の window 判定を，first_entry と同じ状態情報 (x, h, t, モニタ) で学習する対照。
# 時刻がわかる window 方策は H 前に目標集合を出て戻る軌道を選びやすく，
# first-entry で採点すると成功率が大きく下がることを示す。
seeds: [11, 12, 13, 14, 15]
output_dir: outputs/papers/zemi2_goal_spec_nstep
learning:
  alpha: 0.5
  gamma: 0.99
  epsilon:
    start: 1.0
    end: 0.01
  n_step: 10
reward:
  step: 2.0
  terminal: 80.0
  edge_cost: 1.0
  violation_penalty: 0.0
horizon:
  max_steps: 10
  goal_spec: window
  time_in_state: true
models:
  cortical:
    episodes: 15000
    reach_horizon: 5
    constraint_type: monotone
  wnt5a:
    episodes: 24000
    reach_horizon: 7
    constraint_type: recovery
    recovery_tau: 2
    initial_states: all
