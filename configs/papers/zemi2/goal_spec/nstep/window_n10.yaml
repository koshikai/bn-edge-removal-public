# ゼミ資料 2（tex/zemi2/）: 成功判定（goal_spec）の主比較。c_edge=1.0，n-step n=10。
#
# 現行の window 判定（[H,T] で目標集合内）を，first_entry と同じ n-step 更新で学習する対照。
# 状態は (x, h) のみ（時刻・モニタなし）。window 判定は H 前に出て戻る軌道を許すため，
# 同じ方策を first-entry で採点すると成功率が下がることを示す。
seeds: [11, 12, 13, 14, 15]
output_dir: outputs/papers/zemi2_goal_spec_nstep
learning:
  alpha: 0.5
  gamma: 0.99
  epsilon:
    start: 1.0
    end: 0.01
  n_step: 10
reward:
  step: 2.0
  terminal: 80.0
  edge_cost: 1.0
  violation_penalty: 0.0
horizon:
  max_steps: 10
  goal_spec: window
  time_in_state: false
models:
  cortical:
    episodes: 15000
    reach_horizon: 5
    constraint_type: monotone
  wnt5a:
    episodes: 24000
    reach_horizon: 7
    constraint_type: recovery
    recovery_tau: 2
    initial_states: all
