# ゼミ資料 2（tex/zemi2/）の考察用設定
#
# 学習時の巡回集合は 96 状態（原稿与传统の集合）に保ち，
# 評価対象だけを全 128 状態へ広げた設定。
# 「学習集合を広くすると成功率が落ちる」ことの比較用。
seeds: [11, 12, 13, 14, 15]
output_dir: outputs/papers/zemi2_train96
learning:
  alpha: 0.5
  gamma: 0.99
  epsilon:
    start: 1.0
    end: 0.01
reward:
  step: 2.0
  terminal: 80.0
  edge_cost: 0.1
  violation_penalty: 0.0
horizon:
  max_steps: 10
models:
  cortical:
    episodes: 15000
    reach_horizon: 5
    constraint_type: monotone
  wnt5a:
    episodes: 24000
    reach_horizon: 7
    constraint_type: recovery
    recovery_tau: 2
    initial_states: controllable
    evaluation_initial_states: all
