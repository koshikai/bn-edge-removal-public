# ゼミ資料 2（tex/zemi2/）の副結果: 目標集合内だけ per-step で課金する比較
#
# c_edge は原稿と同じ 0.1 に戻し，目標集合内では edge_cost の代わりに
# goal_edge_cost=5.0 を課す。単調性では除去済みエッジを u=1 で保持し続ける
# 必要があるため，この per-step 版は「保持しているだけの介入」にも毎ステップ
# 課金する。Cortical で制御が崩れることを示すための比較用（推奨設定ではない）。
seeds: [11, 12, 13, 14, 15]
output_dir: outputs/papers/zemi2_goal_onset
learning:
  alpha: 0.5
  gamma: 0.99
  epsilon:
    start: 1.0
    end: 0.01
reward:
  step: 2.0
  terminal: 80.0
  edge_cost: 0.1
  goal_edge_cost: 5.0
  violation_penalty: 0.0
horizon:
  max_steps: 10
models:
  cortical:
    episodes: 15000
    reach_horizon: 5
    constraint_type: monotone
  wnt5a:
    episodes: 24000
    reach_horizon: 7
    constraint_type: recovery
    recovery_tau: 2
    initial_states: all
